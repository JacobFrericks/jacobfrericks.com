name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json lists, or fails.
      - run: npm ci
      # Type-checks all Astro and TypeScript files; any warning fails the build.
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Same tar flags as actions/upload-pages-artifact, so Pages serves the exact bytes we attest.
      - name: Package site
        run: |
          tar --dereference --hard-dereference --directory dist -cvf artifact.tar --exclude=.git --exclude=.github .
          cp artifact.tar site.tar

      - name: Hash site bundle
        id: hash
        run: echo "hashes=$(sha256sum site.tar | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site.tar
          if-no-files-found: error

  # Each deploy from main gets a release holding the exact bundle that ships.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: site-${{ github.run_number }}
        run: gh release create "$TAG" site.tar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Site bundle built from $GITHUB_SHA."

  # SLSA Build L3 provenance. slsa-verifier only trusts this builder by tag, so it is
  # pinned to a version tag here instead of a SHA.
  provenance:
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result != 'failure' }}
    needs: [build, release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: site.intoto.jsonl
      upload-assets: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      upload-tag-name: site-${{ github.run_number }}

  # Only main deploys, and only after provenance is signed.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
