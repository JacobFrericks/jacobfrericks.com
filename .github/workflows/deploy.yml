name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json lists, or fails.
      - run: npm ci
      # Type-checks all Astro and TypeScript files; any warning fails the build.
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Same tar flags as actions/upload-pages-artifact, so Pages serves the exact bytes we attest.
      - name: Package site
        run: |
          tar --dereference --hard-dereference --directory dist -cvf artifact.tar --exclude=.git --exclude=.github .
          cp artifact.tar site.tar

      # CycloneDX SBOM of every package used to build the site, from npm itself (no extra tool).
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > site.cdx.json

      # Both files become subjects of the SLSA provenance, so the SBOM is signed with the bundle.
      - name: Hash release files
        id: hash
        run: echo "hashes=$(sha256sum site.tar site.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: |
            site.tar
            site.cdx.json
          if-no-files-found: error

  # Keeps a release PR open with the next version and changelog, built from Conventional Commits.
  # Merging that PR creates the release. A GitHub App token is used so CI runs on the release PR.
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attaches the exact bundle that ships, and its SBOM, to the new release.
  upload-bundle:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [build, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
      - name: Upload site bundle and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" site.tar site.cdx.json --repo "$GITHUB_REPOSITORY"

  # SLSA Build L3 provenance. Pull requests sign it to exercise the pipeline; releases also publish it.
  # slsa-verifier only trusts this builder by tag, so it is pinned to a version tag instead of a SHA.
  provenance:
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'pull_request' || needs.release-please.outputs.release_created == 'true') }}
    needs: [build, release-please]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: site.intoto.jsonl
      upload-assets: ${{ needs.release-please.outputs.release_created == 'true' }}
      upload-tag-name: ${{ needs.release-please.outputs.tag_name }}

  # Only releases deploy, and only after the bundle and provenance are attached.
  deploy:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [build, release-please, upload-bundle, provenance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
