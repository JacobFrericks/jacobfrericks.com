name: zizmor

# Static analysis of GitHub Actions workflows: injection, risky triggers, broad permissions, unpinned actions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Medium or higher fails the check. Rule settings live in .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
