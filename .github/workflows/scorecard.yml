name: Scorecard

# OpenSSF Scorecard grades the repo's supply chain practices and publishes the score.
# It reads branch protection, so it also runs when those rules change.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "29 6 * * 1"

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write # Signs the results so they can be published to the public Scorecard API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publishing requires this job to use only approved actions and no run steps.
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
