name: Scorecard

# OpenSSF Scorecard grades the repo's supply chain practices and publishes the score.
# It reads branch protection, so it also runs when those rules change.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "29 6 * * 1"

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write # Signs the results so they can be published to the public Scorecard API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publishing requires this job to use only approved actions and no run steps.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard
