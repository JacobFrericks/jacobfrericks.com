name: Semgrep

# SAST: unsafe patterns in our own code and workflows. Metrics are off, so nothing is sent to Semgrep.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is pinned in .github/semgrep/Dockerfile, where Dependabot keeps it current.
      - name: Build Semgrep image
        run: docker build -t semgrep-local .github/semgrep

      # Runs as a non-root user with the repo mounted read-only. SARIF goes to stdout.
      - name: Run Semgrep
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep-local \
            semgrep scan --metrics=off --error \
              --config p/javascript --config p/typescript --config p/github-actions --config p/secrets \
              --sarif > semgrep.sarif

      - if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
